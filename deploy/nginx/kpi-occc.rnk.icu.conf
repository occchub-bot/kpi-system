# ปลายทาง: /etc/nginx/sites-available/kpi-occc.rnk.icu
#   sudo ln -s /etc/nginx/sites-available/kpi-occc.rnk.icu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ตอนนี้เปิดแค่ 80 — จะทำ SSL ทีหลังด้วย `sudo certbot --nginx -d kpi-occc.rnk.icu`
# (certbot จะแก้ไฟล์นี้เพิ่ม block 443 ให้เอง)

server {
    listen 80;
    listen [::]:80;
    server_name kpi-occc.rnk.icu;

    # ไฟล์อัปโหลด/รายงานอาจใหญ่กว่า default 1M
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # static ของ Next มี hash ในชื่อไฟล์อยู่แล้ว cache ยาวได้
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3777;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
